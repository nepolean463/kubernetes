---
- name: Check if Kubernetes control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_admin_conf

- name: Initialize Kubernetes Control Plane with kubeadm (using internal KVM network)
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ internal_ip }}
    --apiserver-cert-extra-sans={{ ansible_host }},{{ internal_ip }}
    --pod-network-cidr={{ pod_network_cidr }}
    --node-name={{ inventory_hostname }}
  when: not k8s_admin_conf.stat.exists
  register: kubeadm_init_output
  changed_when: true

- name: Create .kube directory for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Copy admin.conf to ubuntu user's kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Deploy Flannel CNI network plugin
  ansible.builtin.command: >
    kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  become_user: ubuntu
  register: flannel_output
  changed_when: "'created' in flannel_output.stdout or 'configured' in flannel_output.stdout"

- name: Configure Flannel to route pod traffic over internal KVM network
  ansible.builtin.command: >
    kubectl patch ds kube-flannel-ds -n kube-flannel --type=json -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--iface-regex=10.240.0.*"}]'
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  become_user: ubuntu
  register: flannel_patch
  failed_when: false
  changed_when: "'patched' in flannel_patch.stdout"

- name: Fetch admin.conf to local machine
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true

- name: Ensure local kubeconfig points to external LAN IP for universal access
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: 'server: https://10\.240\.0\.10:6443'
    replace: 'server: https://{{ ansible_host }}:6443'
  delegate_to: localhost
  become: false

- name: Fetch admin.conf to repository root kubeconfig
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

- name: Ensure repository kubeconfig points to external LAN IP
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../kubeconfig"
    regexp: 'server: https://10\.240\.0\.10:6443'
    replace: 'server: https://{{ ansible_host }}:6443'
  delegate_to: localhost
  become: false

- name: Generate fresh kubeadm join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: raw_join_command
  changed_when: false

- name: Set join command fact across all hosts
  ansible.builtin.set_fact:
    k8s_join_command: "{{ raw_join_command.stdout.strip() }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['k8s_cluster'] }}"
