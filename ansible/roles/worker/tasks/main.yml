---
- name: Check if worker node is already joined to the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join worker node to Kubernetes cluster
  ansible.builtin.command: "{{ k8s_join_command }} --node-name={{ inventory_hostname }}"
  when: not kubelet_conf.stat.exists
  register: join_output
  changed_when: true

- name: Ensure kubelet service is running on worker
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true
