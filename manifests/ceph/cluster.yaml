apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.4
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  waitTimeoutForHealthyOSDInMinutes: 10
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 1
    modules:
      - name: pg_autoscaler
        enabled: true
  dashboard:
    enabled: true
    ssl: true
  crashCollector:
    disable: true
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
  resources:
    mgr:
      limits:
        memory: "1024Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    mon:
      limits:
        memory: "1024Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    osd:
      limits:
        memory: "1536Mi"
      requests:
        cpu: "200m"
        memory: "512Mi"
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: "k8s-storage-1"
        devices:
          - name: "vdb"
      - name: "k8s-storage-2"
        devices:
          - name: "vdb"
      - name: "k8s-storage-3"
        devices:
          - name: "vdb"
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/storage
                  operator: In
                  values:
                    - "true"
  disruptionManagement:
    managePodBudgets: false
    osdMaintenanceTimeout: 30
    pgHealthCheckTimeout: 0
