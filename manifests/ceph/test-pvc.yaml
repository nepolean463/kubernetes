apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-test-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block
---
apiVersion: v1
kind: Pod
metadata:
  name: ceph-test-pod
spec:
  containers:
    - name: web-test
      image: nginx:alpine
      volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: ceph-storage
  volumes:
    - name: ceph-storage
      persistentVolumeClaim:
        claimName: ceph-test-pvc
